spring:
  profiles:
    default: local   # 프로파일 미지정 시 로컬로 (운영은 docker가 SPRING_PROFILES_ACTIVE=prod 주입)
  application:
    name: Licensify
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/licensify
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false
        format_sql: false
        use_sql_comments: false
        ddl-auto: none
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI}

  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    redirect-uri: ${OAUTH_GITHUB_REDIRECT_URI}

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${OAUTH_NAVER_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET_KEY}

encrypt:
  secret-key: ${ENCRYPT_SECRET_KEY:01234567890123456789012345678901}  # 32바이트

toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_docs_Ovk5rk1EwkEbP0W43n07xlzm}

sdk:
  signing:
    ed25519-private-key: ${ED25519_PRIVATE_KEY}
    ed25519-key-id: 1