name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [test-ci]   # CI 자체를 테스트해볼 때용 (선택)

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload test report
        if: always() # 실패해도 리포트는 올림
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/